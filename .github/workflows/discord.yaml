name: Discord Notification
on:
  push:
  release:
    types: [published]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        if: github.event_name == 'push'
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      
      - name: Send to Discord (Push)
        if: github.event_name == 'push'
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          # Create a proper JSON payload file
          cat > payload.json <<'EOF'
          {
            "embeds": [{
              "title": "",
              "description": "",
              "color": 5814783,
              "fields": [
                {"name": "Repository", "value": "", "inline": true},
                {"name": "Branch", "value": "", "inline": true},
                {"name": "Author", "value": "", "inline": true},
                {"name": "Diff Preview", "value": "", "inline": false}
              ],
              "timestamp": "",
              "url": ""
            }]
          }
          EOF
          
          COMMIT_MSG_TITLE=$(echo '${{ github.event.head_commit.message }}' | head -n 1)
          COMMIT_MSG_BODY=$(echo '${{ github.event.head_commit.message }}' | tail -n +2)
          AUTHOR="${{ github.event.head_commit.author.name }}"
          REPO="${{ github.repository }}"
          BRANCH="${{ github.ref_name }}"
          URL="${{ github.event.head_commit.url }}"
          TIMESTAMP="${{ github.event.head_commit.timestamp }}"
          
          DIFF=$(git diff HEAD^ HEAD | head -n 10 | head -c 400)
          if [ -z "$DIFF" ]; then
            DIFF="No changes"
          fi
          
          # Use jq to properly build JSON
          jq --arg title "📝 $COMMIT_MSG_TITLE" \
             --arg desc "$COMMIT_MSG_BODY" \
             --arg repo "$REPO" \
             --arg branch "$BRANCH" \
             --arg author "$AUTHOR" \
             --arg diff "$DIFF" \
             --arg url "$URL" \
             --arg time "$TIMESTAMP" \
             '.embeds[0].title = $title |
              .embeds[0].description = $desc |
              .embeds[0].fields[0].value = $repo |
              .embeds[0].fields[1].value = ("`" + $branch + "`") |
              .embeds[0].fields[2].value = $author |
              .embeds[0].fields[3].value = ("```diff\n" + $diff + "\n```") |
              .embeds[0].timestamp = $time |
              .embeds[0].url = $url' payload.json > final.json
          
          curl -H "Content-Type: application/json" -d @final.json $DISCORD_WEBHOOK
      
      - name: Send to Discord (Release)
        if: github.event_name == 'release'
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          cat > payload.json <<'EOF'
          {
            "embeds": [{
              "title": "",
              "description": "",
              "color": 3066993,
              "fields": [
                {"name": "Repository", "value": "", "inline": true},
                {"name": "Tag", "value": "", "inline": true}
              ],
              "timestamp": "",
              "url": ""
            }]
          }
          EOF
          
          RELEASE_NAME="${{ github.event.release.name }}"
          RELEASE_BODY="${{ github.event.release.body }}"
          TAG="${{ github.event.release.tag_name }}"
          REPO="${{ github.repository }}"
          URL="${{ github.event.release.html_url }}"
          TIMESTAMP="${{ github.event.release.published_at }}"
          
          jq --arg title "🚀 New Release: $RELEASE_NAME" \
             --arg desc "$RELEASE_BODY" \
             --arg repo "$REPO" \
             --arg tag "$TAG" \
             --arg url "$URL" \
             --arg time "$TIMESTAMP" \
             '.embeds[0].title = $title |
              .embeds[0].description = $desc |
              .embeds[0].fields[0].value = $repo |
              .embeds[0].fields[1].value = ("`" + $tag + "`") |
              .embeds[0].timestamp = $time |
              .embeds[0].url = $url' payload.json > final.json
          
          curl -H "Content-Type: application/json" -d @final.json $DISCORD_WEBHOOK
