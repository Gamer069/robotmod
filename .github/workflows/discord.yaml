name: Discord Notification
on:
  push:
  release:
    types: [published]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        if: github.event_name == 'push'
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      
      - name: Send to Discord (Push)
        if: github.event_name == 'push'
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          COMMIT_MSG_TITLE=$(echo '${{ github.event.head_commit.message }}' | head -n 1)
          COMMIT_MSG_BODY=$(echo '${{ github.event.head_commit.message }}' | tail -n +2 | head -c 200)
          AUTHOR="${{ github.event.head_commit.author.name }}"
          REPO="${{ github.repository }}"
          BRANCH="${{ github.ref_name }}"
          URL="${{ github.event.head_commit.url }}"
          TIMESTAMP="${{ github.event.head_commit.timestamp }}"
          
          # Get a short diff (max 10 lines, 500 chars)
          DIFF=$(git diff HEAD^ HEAD | head -n 10 | head -c 500)
          if [ -z "$DIFF" ]; then
            DIFF="No changes to display"
          fi
          
          # Escape JSON special characters
          DIFF=$(echo "$DIFF" | jq -Rs .)
          COMMIT_MSG_BODY=$(echo "$COMMIT_MSG_BODY" | jq -Rs .)
          
          curl -H "Content-Type: application/json" \
               -d "{
                 \"embeds\": [{
                   \"title\": \"📝 $COMMIT_MSG_TITLE\",
                   \"description\": $COMMIT_MSG_BODY,
                   \"color\": 5814783,
                   \"fields\": [
                     {\"name\": \"Repository\", \"value\": \"$REPO\", \"inline\": true},
                     {\"name\": \"Branch\", \"value\": \"\`$BRANCH\`\", \"inline\": true},
                     {\"name\": \"Author\", \"value\": \"$AUTHOR\", \"inline\": true},
                     {\"name\": \"Diff Preview\", \"value\": \"\`\`\`diff\n\" + $DIFF + \"\n\`\`\`\", \"inline\": false}
                   ],
                   \"timestamp\": \"$TIMESTAMP\",
                   \"url\": \"$URL\"
                 }]
               }" \
               $DISCORD_WEBHOOK
      
      - name: Send to Discord (Release)
        if: github.event_name == 'release'
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          RELEASE_NAME="${{ github.event.release.name }}"
          RELEASE_BODY=$(echo '${{ github.event.release.body }}' | head -c 300 | jq -Rs .)
          TAG="${{ github.event.release.tag_name }}"
          REPO="${{ github.repository }}"
          URL="${{ github.event.release.html_url }}"
          TIMESTAMP="${{ github.event.release.published_at }}"
          
          curl -H "Content-Type: application/json" \
               -d "{
                 \"embeds\": [{
                   \"title\": \"🚀 New Release: $RELEASE_NAME\",
                   \"description\": $RELEASE_BODY,
                   \"color\": 3066993,
                   \"fields\": [
                     {\"name\": \"Repository\", \"value\": \"$REPO\", \"inline\": true},
                     {\"name\": \"Tag\", \"value\": \"\`$TAG\`\", \"inline\": true}
                   ],
                   \"timestamp\": \"$TIMESTAMP\",
                   \"url\": \"$URL\"
                 }]
               }" \
               $DISCORD_WEBHOOK
